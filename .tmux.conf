# === tmux Configuration for Coding Agent Workflow ===
# === Updated 2025-07-19 ===

# ===== General Settings =====

# Start indexes at 1
set -g base-index 1
setw -g pane-base-index 1

# Auto-rename windows
setw -g automatic-rename on
set -g renumber-windows on

# Terminal colors
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"

# Mouse support
set -g mouse on

# Scrollback buffer
setw -g history-limit 50000

# Reduce escape time (vibe in vim mode)
set -s escape-time 0

# ===== Session Management =====

# New session (no session name - auto-generates)
bind-key -n M-n new-session

# Create session with name: M-c "sessionname"
bind-key -n M-c command-prompt -p "Session name:" "new-session -n main '%%'"

# List and switch sessions via telescope/menu
bind-key -n M-s command-prompt -p "#S" "switch-session -t '%%'"

# Rename current session
bind-key -n M-R command-prompt -p "New name:" "rename-session '%%'"

# Kill session (with confirmation disabled for speed)
bind-key -n M-d kill-session -a -t :

# ===== Tab/Window Management =====

# New window
bind-key -n M-w new-window

# Next/Previous window
bind-key -n M-l next-window
bind-key -n M-h previous-window

# Jump to window by number
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 last-window
bind-key -n M-0 select-window -t -1

# Rename window
bind-key -n M-W command-prompt -p "Window name:" "rename-window '%%'"

# Close current window
bind-key -n M-z kill-window

# ===== Pane Management =====

# Split panes
bind-key -n M-v split-window -h -c "#{pane_current_path}"
bind-key -n M-b split-window -v -c "#{pane_current_path}"

# Swap panes
bind-key -T prefix H swap-pane -U
bind-key -T prefix L swap-pane -D

# Resize panes (prefix + shift + arrow)
bind -T prefix -r S-Left resize-pane -L 5
bind -T prefix -r S-Down resize-pane -D 5
bind -T prefix -r S-Up resize-pane -U 5
bind -T prefix -r S-Right resize-pane -R 5

# Equalize panes
bind -r = select-layout -E

# Zoom/unzoom active pane
bind -r z resize-pane -Z

# vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Navigate panes with Vim keys (without prefix) via session-local bindings
# These only work when tmux receives the keys - for global, use M-<j>

# Panes: kill (prefix + x)
bind x kill-pane

# ===== Copy Mode (vim bindings) =====

setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi p paste-buffer

# ===== Synchronization =====

# Sync panes (useful for demoing)
setw -g synchronize-panes off
bind-key -n M-Y display-message "toggle sync on/off"
bind -r Y setw -g synchronize-panes @on
bind -r y setw -g synchronize-panes @off

# ===== Reload/Debug =====

# Reload config
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# Show keybindings
bind-key '?' list-keys

# ===== Status Bar (Catppuccin) =====

set -g status-position bottom
set -g status-justify left
set -g status-left-length 30
set -g status-right-length 50

# Pane borders
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=blue'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'

set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_status_left_separator ''
set -g @catppuccin_status_right_separator ' '
set -g @catppuccin_window_left_separator ''
set -g @catppuccin_window_right_separator ' '
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_default_fill 'number'
set -g @catppuccin_window_current_fill 'number'

set -g status-right-length 100
set -g status-left-length 100
set -g status-left ''
set -g status-right '#{E:@catppuccin_status_session}'
set -ag status-right '#{E:@catppuccin_status_date_time}'

run '~/.tmux/plugins/tpm/tpm'

# ===== Project Templates (quick session creates) =====

# Create new tmux session from a project with optional project name and path
# Usage: tmux new -n <project_name> (then type the path when prompted)
bind-key -n M-p command-prompt -p "Project name and path (e.g. myapp ~/projects/myapp):" "new-session -n main 'cd %% || exit'"

# List sessions (status bar shortcut)
bind-key -n M-S display-message "Sessions: #S"
